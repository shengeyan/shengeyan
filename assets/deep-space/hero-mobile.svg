imation-delay: -6s" cx="85" cy="285" r="1.8" fill="#6d58a4" opacity=".35"/><circle  cx="158" cy="338" r="1" fill="#46679f" opacity=".35"/><ellipse cx="220" cy="413" rx="166" ry="53" transform="rotate(-23 220 413)" fill="none" stroke="#46679f" stroke-opacity=".5" stroke-dasharray="none"/><ellipse class="hero-orbit-flow" style="animation-duration: 24s" cx="220" cy="413" rx="166" ry="53" transform="rotate(-23 220 413)" pathLength="360" fill="none" stroke="#46679f" stroke-width="1.5" stroke-opacity=".65" stroke-dasharray="32 328"/><ellipse cx="220" cy="413" rx="112" ry="134" transform="rotate(35 220 413)" fill="none" stroke="#b9a9df" stroke-opacity=".5" stroke-dasharray="3 5"/><ellipse class="hero-orbit-flow" style="animation-duration: 36s" cx="220" cy="413" rx="112" ry="134" transform="rotate(35 220 413)" pathLength="360" fill="none" stroke="#6d58a4" stroke-width="1.5" stroke-opacity=".65" stroke-dasharray="32 328"/><ellipse cx="220" cy="413" rx="164" ry="83" transform="rotate(25 220 413)" fill="none" stroke="#b9a9df" stroke-opacity=".5" stroke-dasharray="none"/><ellipse class="hero-orbit-flow" style="animation-duration: 30s" cx="220" cy="413" rx="164" ry="83" transform="rotate(25 220 413)" pathLength="360" fill="none" stroke="#6d58a4" stroke-width="1.5" stroke-opacity=".65" stroke-dasharray="32 328"/><path d="M207 413h26 M220 400v26" stroke="#46679f" opacity=".3"/><circle cx="220" cy="413" r="70" fill="url(#planet)" stroke="#bdcbe6"/><ellipse cx="220" cy="413" rx="159" ry="43" transform="rotate(-23 220 413)" fill="none" stroke="#899bd1"/><g transform="translate(220 413) rotate(-23)"><g class="hero-moving-dot"><circle r="8" fill="#46679f" opacity=".1"/><circle r="4" fill="#46679f" stroke="#f8faff" stroke-width="2"/><animateMotion path="M 159 0 A 159 43 0 1 1 -159 0 A 159 43 0 1 1 159 0" dur="18s" begin="-5s" repeatCount="indefinite"/></g><circle class="hero-resting-dot" cx="159" cy="0" r="4" fill="#46679f" stroke="#f8faff" stroke-width="2"/></g><g transform="translate(220 413) rotate(25)"><g class="hero-moving-dot"><circle r="8" fill="#6d58a4" opacity=".1"/><circle r="4" fill="#6d58a4" stroke="#f8faff" stroke-width="2"/><animateMotion path="M 164 0 A 164 83 0 1 1 -164 0 A 164 83 0 1 1 164 0" dur="26s" begin="-13s" repeatCount="indefinite"/></g><circle class="hero-resting-dot" cx="164" cy="0" r="4" fill="#6d58a4" stroke="#f8faff" stroke-width="2"/></g><g transform="translate(220 413) rotate(35)"><g class="hero-moving-dot"><circle r="8" fill="#a15336" opacity=".1"/><circle r="4" fill="#a15336" stroke="#f8faff" stroke-width="2"/><animateMotion path="M 112 0 A 112 134 0 1 1 -112 0 A 112 134 0 1 1 112 0" dur="32s" begin="-21s" repeatCount="indefinite"/></g><circle class="hero-resting-dot" cx="112" cy="0" r="4" fill="#a15336" stroke="#f8faff" stroke-width="2"/></g><text x="301" y="325" fill="#6d58a4" font-size="9" font-family="sans-serif" class="mono">AI / TOOLS</text><text x="65" y="529" fill="#46679f" font-size="9" font-family="sans-serif" class="mono">WEB / CRAFT</text><text x="32" y="104" fill="#6d58a4" font-size="10" font-family="sans-serif" class="mono" letter-spacing=".5">FRONTEND DEVELOPER · CS STUDENT</text><text x="30" y="158" fill="#263653" font-size="49" font-family="sans-serif" font-weight="650" letter-spacing="-2">ShenGeYan</text><text x="32" y="190" fill="#536681" font-size="14" font-family="sans-serif" >沈歌宴 / 重庆理工大学</text><text x="32" y="239" fill="#263653" font-size="29" font-family="sans-serif" letter-spacing="-1">Ideas, built into</text><text x="32" y="278" fill="#46679f" font-size="37" font-family="sans-serif" class="serif" font-style="italic" letter-spacing="-1">useful things.</text><text x="220" y="571" fill="#536681" font-size="14" font-family="sans-serif" text-anchor="middle">用代码把想法做成作品，把细节做到好用。</text><path d="M28 593H412" stroke="#dce4f1" fill="none"/><text x="28" y="618" fill="#64748b" font-size="9" font-family="sans-serif" class="mono">CHONGQING, CN / FRONTEND × AI</text><text x="412" y="618" fill="#46679f" font-size="9" font-family="sans-serif" class="mono" text-anchor="end">COMMIT → BUILD</text></svg>