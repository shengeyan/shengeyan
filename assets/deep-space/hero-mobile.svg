<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="440" height="638" viewBox="0 0 440 638" role="img" aria-labelledby="title desc">
<title id="title">ShenGeYan / 浅色动态代码星图</title><desc id="desc">Light code atlas with orbiting satellites, flowing orbital highlights and a gently breathing halo. Reduced-motion preferences display a still illustration.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','Microsoft YaHei',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.serif{font-family:Georgia,'Times New Roman',serif}</style>
<rect x=".5" y=".5" width="439" height="637" rx="16" fill="#f8faff" stroke="#dce4f1"/><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#ccd9ed"/></pattern><radialGradient id="glow"><stop stop-color="#e2dcf5" stop-opacity=".9"/><stop offset="1" stop-color="#f8faff" stop-opacity="0"/></radialGradient><radialGradient id="planet" cx="28%" cy="25%" r="85%"><stop stop-color="#ffffff"/><stop offset=".38" stop-color="#e2eafa"/><stop offset=".74" stop-color="#c6c5e8"/><stop offset="1" stop-color="#9daed7"/></radialGradient></defs><style>
@keyframes hero-orbit-flow { to { stroke-dashoffset: -360; } }
@keyframes hero-glow-breathe { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
@keyframes hero-star-twinkle { 0%,100% { opacity: .25; } 50% { opacity: .6; } }
.hero-orbit-flow { animation: hero-orbit-flow 24s linear infinite; }
.hero-glow { animation: hero-glow-breathe 8s ease-in-out infinite; }
.hero-star { animation: hero-star-twinkle 7s ease-in-out infinite; }
.hero-resting-dot { display: none; }
@media (prefers-reduced-motion: reduce) {
  .hero-orbit-flow, .hero-glow, .hero-star { animation: none; }
  .hero-moving-dot { display: none; }
  .hero-resting-dot { display: inline; }
}
