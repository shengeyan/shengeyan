name: Deep Space Profile

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-readme.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: deep-space-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify contribution statistics
        run: python3 -m unittest discover -s tests -v

      - name: Render lowlighter Metrics isocalendar
        id: metrics
        continue-on-error: true
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          user: shengeyan
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          filename: metrics-calendar.svg
          output_action: none
          base: ''
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Shanghai
          config_animations: no
          plugins_errors_fatal: yes

      - name: Keep native Metrics geometry
        if: steps.metrics.outcome == 'success'
        run: cp /metrics_renders/metrics-calendar.svg assets/deep-space/metrics-source.svg

      - name: Report Metrics fallback
        if: steps.metrics.outcome != 'success'
        run: |
          echo '::warning::Native Metrics could not render. Public-data SVG statistics remain available. A scopeless METRICS_TOKEN can be added for native Metrics.'
          rm -f assets/deep-space/metrics-source.svg

      - name: Refresh public data and Profile artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_profile.py --refresh

      - name: Validate all generated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for asset in Path('assets/deep-space').glob('*.svg'):
              ET.parse(asset)
          print('All SVG assets are valid XML')
          PY

      - name: Publish changed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/deep-space
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh deep space profile signals'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
